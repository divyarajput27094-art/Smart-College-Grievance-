
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Smart Grievance System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #172554, #2563eb);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #1e40af;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Admin Login</h2>
        <p class="subtitle">Smart College Grievance Management System</p>

        <form id="adminLoginForm">

            <label>Admin Login ID</label>
            <input
                type="text"
                id="enrollment_number"
                placeholder="Enter Admin Login ID"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit" id="loginBtn">
                Login as Admin
            </button>

        </form>

        <p id="message"></p>

        <a href="login.html" class="back-link">
            Back to Student Login
        </a>

    </div>

    <script>
        const form = document.getElementById("adminLoginForm");
        const message = document.getElementById("message");
        const loginBtn = document.getElementById("loginBtn");

        form.addEventListener("submit", async function(e) {
            e.preventDefault();

            const enrollment_number =
                document.getElementById("enrollment_number").value.trim();

            const password =
                document.getElementById("password").value;

            message.textContent = "Please wait...";
            message.style.color = "blue";
            loginBtn.disabled = true;

            try {
                const response = await fetch("/api/auth/admin-login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({
                        enrollment_number,
                        password
                    })
                });

                const result = await response.json();

                if (result.success && result.user.role === "admin") {
                    message.textContent = "Login successful!";
                    message.style.color = "green";

                    window.location.href = "admin-dashboard.html";
                } else {
                    message.textContent =
                        result.message || "Admin login failed";
                    message.style.color = "red";
                    loginBtn.disabled = false;
                }

            } catch (error) {
                message.textContent = "Server connection failed.";
                message.style.color = "red";
                loginBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
